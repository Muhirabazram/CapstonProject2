<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Surat STMIK Bandung</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon bg-transparent" style="width: auto; height: auto; background: none; display: flex; justify-content: center; margin-bottom: 0.5rem;">
                    <img src="assets/img/logo-kampus.png" alt="Logo Kampus" style="width: 140px; height: auto;">
                </div>
                <h2>Selamat Datang</h2>
                <p class="text-muted">Sistem Pengelolaan Administrasi Surat STMIK Bandung</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">NPM / Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan NPM atau Username" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan Password" required>
                </div>

                <div class="form-group">
                    <label for="roleSelect" class="form-label">Login Sebagai</label>
                    <select id="roleSelect" class="form-control form-select">
                        <option value="mahasiswa">Mahasiswa</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-group mt-4">
                    <button type="submit" class="btn btn-primary btn-block">Masuk ke Sistem</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-muted" style="font-size: 0.875rem;">Lupa password? Hubungi Bagian Akademik</p>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
